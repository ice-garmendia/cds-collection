*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;transition:background 0.25s,color 0.25s}
body.dark{--bg:#0a0a14;--bg2:#10101c;--bg3:#13131f;--bg4:#1a1a28;--bg5:#1e1e2e;--border:#1a1a28;--border2:#2a2a3d;--text:#e8e8f0;--text2:#c0c0d8;--text3:#9090b0;--text4:#5a5a7a;--text5:#3a3a5a;--text6:#2a2a40;--accent:#6366f1;--gold:#fbbf24;--green:#4ade80;--header-bg:rgba(10,10,20,0.97);--filter-bg:rgba(10,10,20,0.95);--scrollbar-thumb:#252538;--placeholder:#2a2a40;--select-bg:#10101c;--input-bg:#0d0d1a;--input-border:#252538}
body.light{--bg:#f5f5f8;--bg2:#ffffff;--bg3:#fafafa;--bg4:#ededf2;--bg5:#e4e4ec;--border:#e0e0ea;--border2:#c8c8d8;--text:#1a1a2e;--text2:#2a2a42;--text3:#4a4a6a;--text4:#7a7a9a;--text5:#9a9ab8;--text6:#c0c0d8;--accent:#6366f1;--gold:#d97706;--green:#16a34a;--header-bg:rgba(245,245,248,0.97);--filter-bg:rgba(245,245,248,0.95);--scrollbar-thumb:#c8c8d8;--placeholder:#c0c0d8;--select-bg:#ffffff;--input-bg:#ffffff;--input-border:#d0d0e0}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
input::placeholder{color:var(--placeholder)}
select option{background:var(--select-bg)}
.tab{padding:8px 18px;border:none;background:transparent;cursor:pointer;font-family:'DM Mono',monospace;font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.2s;border-bottom:2px solid transparent;color:var(--text5)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text3)}
.tree-row{transition:background 0.15s}
.tree-row:hover{filter:brightness(1.08)}
body.light .tree-row:hover{filter:brightness(0.96)}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.popup-anim{animation:fadeIn 0.18s ease}
</style>

// ── GITHUB SYNC (via GitHub Action — no token in code) ────
const GH_REPO = "ice-garmendia/cds-collection";
const GH_STATE = "data/state.json";

async function ghGetState() {
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_STATE}`,{
      headers:{"Accept":"application/vnd.github.v3+json"}
    });
    if(!r.ok) return null;
    const d = await r.json();
    const state = JSON.parse(atob(d.content.replace(/\n/g,"")));
    state._sha = d.sha;
    return state;
  } catch(e) { return null; }
}

async function ghSaveState(state, sha) {
  try {
    const token = localStorage.getItem("gh_token");
    if(!token) return null;
    const body = {
      message: "Update collection state",
      content: btoa(unescape(encodeURIComponent(JSON.stringify({
        movedToCollection: state.movedToCollection,
        movedToWantlist: state.movedToWantlist,
        lastUpdated: new Date().toISOString()
      },null,2)))),
      sha: sha
    };
    const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_STATE}`,{
      method:"PUT",
      headers:{"Authorization":`token ${token}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
      body: JSON.stringify(body)
    });
    if(!r.ok) return null;
    const d = await r.json();
    return d.content.sha;
  } catch(e) { return null; }
}
async function checkPassword(pwd){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pwd));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")===ADMIN_HASH;}

// ── TREE VIEW ─────────────────────────────────────────────
function TreeView({cds,onSelect}){
  const [openA,setOpenA]=useState({});
  const [openC,setOpenC]=useState({});
  const [openT,setOpenT]=useState({});

  const tree=useMemo(()=>{
    const out={};
    ARTISTS.forEach(artist=>{
      const aCds=cds.filter(c=>c.artist===artist);
      if(!aCds.length) return;
      out[artist]={};
      const SINGLES_CATS=["CD3","CD5","CD5 Enhanced","CD3 · Live","CD5 · Live"];
      const rawCats=[...new Set(aCds.map(c=>c.genre.replace(" · Live","")))];
      const cats=[...new Set(rawCats.map(c=>SINGLES_CATS.includes(c)?"Singles":c))].sort();
      cats.forEach(cat=>{
        const cCds=cat==="Singles"
          ?aCds.filter(c=>SINGLES_CATS.includes(c.genre.replace(" · Live",""))||SINGLES_CATS.includes(c.genre))
          :aCds.filter(c=>c.genre.replace(" · Live","")=== cat&&!SINGLES_CATS.includes(c.genre.replace(" · Live","")));
        if(!cCds.length) return;
        out[artist][cat]={};
        const titles=[...new Set(cCds.map(c=>c.album))].sort((a,b)=>{
          const minA=Math.min(...cCds.filter(c=>c.album===a).map(c=>c.year||9999));
          const minB=Math.min(...cCds.filter(c=>c.album===b).map(c=>c.year||9999));
          return minA-minB;
        });
        titles.forEach(title=>{
          const COUNTRY_ORDER=["UK","EUROPE","NETHERLANDS","HOLLAND","JAPAN","USA"];
          const countryRank=c=>{
            const idx=COUNTRY_ORDER.indexOf((c.country||"").toUpperCase());
            return idx>=0?idx:COUNTRY_ORDER.length;
          };
          out[artist][cat][title]=cCds.filter(c=>c.album===title)
            .sort((a,b)=>{
              const yearDiff=(a.issueYear||0)-(b.issueYear||0);
              if(yearDiff!==0) return yearDiff;
              return countryRank(a)-countryRank(b);
            });
        });
      });
    });
    return out;
  },[cds]);

  const totVal=cds.reduce((s,c)=>s+(c.estimatedValue||0),0);

  return h("div",{style:{display:"flex",flexDirection:"column",gap:4}},
    // Summary
    h("div",{style:{display:"flex",gap:20,padding:"6px 0 14px",borderBottom:"1px solid var(--border)",marginBottom:8,flexWrap:"wrap"}},
      h("span",{style:{fontFamily:"'DM Mono',monospace",fontSize:"0.68rem",color:"var(--text5)"}},
        h("span",{style:{color:"var(--accent)"}},cds.length)," ",t.records),
      h("span",{style:{fontFamily:"'DM Mono',monospace",fontSize:"0.68rem",color:"var(--text5)"}},
        h("span",{style:{color:"var(--gold)"}},`€${fmt(totVal)}`)," ",t.totalValue)
    ),

    // Artist rows
    ...Object.entries(tree).map(([artist,cats])=>{
      const c=ac(artist);
      const aCds=cds.filter(x=>x.artist===artist);
      const aVal=aCds.reduce((s,x)=>s+(x.estimatedValue||0),0);
      const isOpen=openA[artist];
      return h("div",{key:artist,style:{marginBottom:4}},
        // Artist header
        h("div",{className:"tree-row",onClick:()=>setOpenA(s=>({...s,[artist]:!s[artist]})),
          style:{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",
            borderRadius:10,cursor:"pointer",
            background:isOpen?`${c}18`:"var(--bg2)",
            border:`1px solid ${isOpen?c+"44":"var(--border)"}`,transition:"all 0.2s"}},
          h("div",{style:{width:36,height:36,borderRadius:8,flexShrink:0,
            background:`linear-gradient(135deg,${c}cc,${c}44)`,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:"0.85rem",fontWeight:900,color:"white",fontFamily:"'Playfair Display',serif"}},
            artist.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()),
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:"0.9rem",fontWeight:700,color:"var(--text)",fontFamily:"'Playfair Display',serif"}},artist),
            h("div",{style:{fontSize:"0.62rem",color:"var(--text4)",fontFamily:"'DM Mono',monospace",marginTop:2}},
              `${aCds.length} ${t.records}${isAdmin?" · €"+fmt(aVal):""}`)
          ),
          h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
            h("div",{style:{fontSize:"0.6rem",color:c,fontFamily:"'DM Mono',monospace"}},
              `${Object.keys(cats).length} ${t.categories}`),
            h("span",{style:{color:"var(--text4)",fontSize:"0.8rem",
              transition:"transform 0.2s",transform:isOpen?"rotate(90deg)":"rotate(0)"}},"›")
          )
        ),

        // Category rows
        isOpen&&h("div",{style:{marginLeft:16,marginTop:4,display:"flex",flexDirection:"column",gap:3}},
          ...Object.entries(cats).map(([cat,titles])=>{
            const ck=`${artist}__${cat}`;
            const cCds=Object.values(titles).flat();
            const cVal=cCds.reduce((s,x)=>s+(x.estimatedValue||0),0);
            const isCOpen=openC[ck];
            return h("div",{key:ck},
              h("div",{className:"tree-row",onClick:()=>setOpenC(s=>({...s,[ck]:!s[ck]})),
                style:{display:"flex",alignItems:"center",gap:10,padding:"9px 14px",
                  borderRadius:8,cursor:"pointer",
                  background:isCOpen?"var(--bg4)":"var(--bg3)",
                  border:`1px solid ${isCOpen?"var(--border2)":"var(--border)"}`,transition:"all 0.15s"}},
                h("div",{style:{width:6,height:6,borderRadius:"50%",background:c,flexShrink:0}}),
                h("div",{style:{flex:1}},
                  h("div",{style:{display:"flex",alignItems:"center",gap:8}},
                  h("span",{style:{color:"var(--text4)",flexShrink:0,display:"flex",alignItems:"center"},dangerouslySetInnerHTML:{__html:catIcon(cat)}}),
                  h("div",{style:{fontSize:"0.78rem",fontWeight:600,color:"var(--text2)",fontFamily:"'DM Mono',monospace",textTransform:"uppercase",letterSpacing:"0.06em"}},cat)
                ),
                  h("div",{style:{fontSize:"0.6rem",color:"var(--text5)",marginTop:1}},
                    `${cCds.length} ${t.records} · ${Object.keys(titles).length} ${t.titles}${isAdmin?" · €"+fmt(cVal):""}`)
                ),
                h("span",{style:{color:"var(--text5)",fontSize:"0.75rem",
                  transition:"transform 0.2s",transform:isCOpen?"rotate(90deg)":"rotate(0)"}},"›")
              ),

              // Title rows
              isCOpen&&h("div",{style:{marginLeft:20,marginTop:3,display:"flex",flexDirection:"column",gap:2}},
                ...Object.entries(titles).map(([title,discs])=>{
                  const tk=`${artist}__${cat}__${title}`;
                  const isTOpen=openT[tk];
                  const tVal=discs.reduce((s,x)=>s+(x.estimatedValue||0),0);
                  const photoDisc=discs.find(c=>c.photos?.length);
                  return h("div",{key:tk},
                    h("div",{className:"tree-row",onClick:()=>setOpenT(s=>({...s,[tk]:!s[tk]})),
                      style:{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",
                        borderRadius:6,cursor:"pointer",
                        background:isTOpen?"var(--bg4)":"transparent",
                        border:`1px solid ${isTOpen?"var(--bg5)":"transparent"}`,transition:"all 0.15s"}},
                      h("div",{style:{width:28,height:28,borderRadius:4,overflow:"hidden",flexShrink:0,
                        position:"relative",background:`linear-gradient(135deg,${c}44,${c}11)`}},
                        photoDisc&&h("img",{src:pUrl(photoDisc.cdId,photoDisc.photos[0],photoDisc._photoId),
                          style:{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"},
                          onError:e=>e.target.style.display="none"})
                      ),
                      h("div",{style:{flex:1}},
                        h("div",{style:{fontSize:"0.8rem",fontWeight:600,color:"var(--text2)",fontFamily:"'Playfair Display',serif"}},title+(discs[0]?.year>0?" ("+discs[0].year+")":"")),
                        h("div",{style:{fontSize:"0.6rem",color:"var(--text5)",marginTop:1}},
                          `${discs.length} ${discs.length===1?t.records.slice(0,-1):t.records}${isAdmin?" · €"+fmt(tVal):""}`)
                      ),
                      h("span",{style:{color:"var(--text5)",fontSize:"0.7rem",
                        transition:"transform 0.2s",transform:isTOpen?"rotate(90deg)":"rotate(0)"}},"›")
                    ),

                    // Disc rows
                    isTOpen&&h("div",{style:{marginLeft:16,marginTop:2,display:"flex",flexDirection:"column",gap:2}},
                      ...discs.map(cd=>{
                        const cc=COND_COLOR[cd.condition]||"var(--text4)";
                        const fp=cd.photos?.length?pUrl(cd.cdId,cd.photos[0],cd._photoId):null;
                        return h("div",{key:cd.cdId,onClick:()=>onSelect(cd),
                          style:{display:"flex",alignItems:"center",gap:10,padding:"7px 12px",
                            borderRadius:6,cursor:"pointer",background:"var(--bg)",
                            border:"1px solid var(--border)",transition:"background 0.15s"},
                          onMouseEnter:e=>e.currentTarget.style.background="#16161e",
                          onMouseLeave:e=>e.currentTarget.style.background="#0a0a12"},
                          h("div",{style:{width:32,height:32,borderRadius:4,overflow:"hidden",
                            flexShrink:0,position:"relative",background:`linear-gradient(135deg,${c}55,${c}11)`}},
                            fp&&h("img",{src:fp,style:{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"},
                              onError:e=>e.target.style.display="none"})
                          ),
                          h("div",{style:{flex:1,display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}},
                            h("div",{style:{display:"flex",alignItems:"center",gap:6}},
                            h("div",{style:{fontSize:"0.62rem",color:"var(--text5)",fontFamily:"'DM Mono',monospace",minWidth:72}},cd.cdId),
                            cd.recentlyAdded&&(Date.now()-cd.recentlyAdded)<86400000&&h("span",{
                              style:{fontSize:"0.55rem",background:`${ac(cd.artist)}33`,
                                border:`1px solid ${ac(cd.artist)}66`,color:ac(cd.artist),
                                padding:"1px 6px",borderRadius:99,fontFamily:"'DM Mono',monospace",
                                fontWeight:700,letterSpacing:"0.05em",whiteSpace:"nowrap"}
                            },"✦ New")
                          ),
                            h("div",{style:{fontSize:"0.72rem",color:"var(--text4)"}},cd.issueYear&&cd.issueYear!==cd.year?cd.issueYear:cd.year||""),
                            cd.country&&h("div",{style:{fontSize:"0.72rem",color:"var(--text4)",display:"flex",alignItems:"center",gap:4}},countryFlag(cd.country)&&h("span",{style:{fontSize:"0.85rem",lineHeight:1}},countryFlag(cd.country)),cd.country),
                            cd.label&&h("div",{style:{fontSize:"0.72rem",color:"var(--text4)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:130}},cd.label),
                            cd.categoryCase&&h("div",{style:{fontSize:"0.68rem",color:"var(--text5)"}},cd.categoryCase),
                            cd.type==="Promo"&&h("span",{style:{fontSize:"0.58rem",background:"#f59e0b22",
                              border:"1px solid #f59e0b44",color:"#f59e0b",padding:"1px 6px",
                              borderRadius:99,fontFamily:"'DM Mono',monospace",fontWeight:600}},"PROMO")
                          ),
                          h("div",{style:{display:"flex",gap:8,alignItems:"center",flexShrink:0}},
                            cd.condition&&h("span",{style:{fontSize:"0.58rem",background:cc+"22",
                              border:`1px solid ${cc}44`,color:cc,padding:"1px 6px",
                              borderRadius:99,fontFamily:"'DM Mono',monospace",fontWeight:600}},cd.condition),
                            cd.estimatedValue>0&&isAdmin&&h("div",{style:{fontSize:"0.75rem",color:"var(--gold)",
                              fontFamily:"'DM Mono',monospace",fontWeight:600,minWidth:50,textAlign:"right"}},
                              `€${fmt(cd.estimatedValue)}`)
                          )
                        );
                      })
                    )
                  );
                })
              )
            );
          })
        )
      );
    })
  );
}


// ── COLLECTION vs WANTLIST CHARTS ─────────────────────────
function CollectionVsWantlist({cds,wantlist}){
  const SINGLES_CATS=["CD3","CD5","CD5 Enhanced"];
  const normCat=c=>{const b=c.genre.replace(" · Live","");return SINGLES_CATS.includes(b)?"Singles":b;};

  // By artist
  const artists=["Queen","Freddie Mercury","Brian May","Roger Taylor","The Cross","Smile","Queen+"];
  const byArtist=artists.map(a=>({
    artist:a,
    collection:cds.filter(c=>c.artist===a).length,
    wantlist:wantlist.filter(c=>c.artist===a).length,
  })).filter(r=>r.collection>0||r.wantlist>0);

  // By category
  const allCats=[...new Set([...cds,...wantlist].map(normCat))].sort();
  const byCat=allCats.map(cat=>({
    cat,
    collection:cds.filter(c=>normCat(c)===cat).length,
    wantlist:wantlist.filter(c=>normCat(c)===cat).length,
  })).filter(r=>r.collection>0||r.wantlist>0);

  const maxArtist=Math.max(...byArtist.map(r=>r.collection+r.wantlist));
  const maxCat=Math.max(...byCat.map(r=>r.collection+r.wantlist));

  const colColor="#6366f1";
  const wlColor="#f59e0b";

  function StackedBar({collection,wantlist,max,color}){
    const total=collection+wantlist;
    const colPct=(collection/max)*100;
    const wlPct=(wantlist/max)*100;
    return h("div",{style:{flex:1,height:22,background:"var(--bg4)",borderRadius:4,overflow:"hidden",display:"flex"}},
      collection>0&&h("div",{style:{width:`${colPct}%`,background:colColor,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:4,minWidth:collection>0?20:0,transition:"width 0.6s"}},
        h("span",{style:{fontSize:"0.6rem",color:"white",fontWeight:600,whiteSpace:"nowrap"}},collection>5?collection:"")
      ),
      wantlist>0&&h("div",{style:{width:`${wlPct}%`,background:wlColor,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:4,minWidth:wantlist>0?20:0,transition:"width 0.6s"}},
        h("span",{style:{fontSize:"0.6rem",color:"white",fontWeight:600,whiteSpace:"nowrap"}},wantlist>5?wantlist:"")
      )
    );
  }

  const totalCol=cds.length;
  const totalWl=wantlist.length;
  const grand=totalCol+totalWl;

  return h("div",{style:{display:"flex",flexDirection:"column",gap:16}},
    h(CollectionVsWantlist,{cds,wantlist:ALL_WANTLIST}),
    h("div",{style:{height:1,background:"var(--border)",margin:"8px 0"}}),

    // Header KPIs
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}},
      h("div",{style:{background:"var(--bg2)",border:`1px solid ${colColor}44`,borderRadius:10,padding:"16px",textAlign:"center"}},
        h("div",{style:{fontSize:"1.8rem",fontWeight:900,fontFamily:"'Playfair Display',serif",color:colColor}},totalCol),
        h("div",{style:{fontSize:"0.62rem",color:"var(--text4)",marginTop:4,textTransform:"uppercase",letterSpacing:"0.08em"}},"In collection"),
        h("div",{style:{fontSize:"0.72rem",color:colColor,marginTop:4}},`${((totalCol/grand)*100).toFixed(1)}% of total`)
      ),
      h("div",{style:{background:"var(--bg2)",border:`1px solid ${wlColor}44`,borderRadius:10,padding:"16px",textAlign:"center"}},
        h("div",{style:{fontSize:"1.8rem",fontWeight:900,fontFamily:"'Playfair Display',serif",color:wlColor}},totalWl),
        h("div",{style:{fontSize:"0.62rem",color:"var(--text4)",marginTop:4,textTransform:"uppercase",letterSpacing:"0.08em"}},"On wantlist"),
        h("div",{style:{fontSize:"0.72rem",color:wlColor,marginTop:4}},`${((totalWl/grand)*100).toFixed(1)}% of total`)
      ),
      h("div",{style:{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"16px",textAlign:"center"}},
        h("div",{style:{fontSize:"1.8rem",fontWeight:900,fontFamily:"'Playfair Display',serif",color:"var(--text)"}},grand),
        h("div",{style:{fontSize:"0.62rem",color:"var(--text4)",marginTop:4,textTransform:"uppercase",letterSpacing:"0.08em"}},"Total universe"),
        h("div",{style:{fontSize:"0.72rem",color:"var(--text5)",marginTop:4}},"Collection + Wantlist")
      )
    ),

    // Overall donut
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}},
      h("div",{style:{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,padding:"20px 24px"}},
        h("div",{style:{fontSize:"0.62rem",color:"var(--text5)",textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:16}},"Overall split"),
        h(DonutChart,{data:{"Collection":totalCol,"Wantlist":totalWl},colors:[colColor,wlColor]})
      ),

      // By category stacked
      h("div",{style:{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,padding:"20px 24px"}},
        h("div",{style:{fontSize:"0.62rem",color:"var(--text5)",textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:16}},"By category"),
        h("div",{style:{display:"flex",gap:12,marginBottom:12}},
          h("div",{style:{display:"flex",alignItems:"center",gap:6}},
            h("div",{style:{width:10,height:10,borderRadius:2,background:colColor}}),
            h("span",{style:{fontSize:"0.65rem",color:"var(--text4)"}},"Collection")),
          h("div",{style:{display:"flex",alignItems:"center",gap:6}},
            h("div",{style:{width:10,height:10,borderRadius:2,background:wlColor}}),
            h("span",{style:{fontSize:"0.65rem",color:"var(--text4)"}},"Wantlist"))
        ),
        h("div",{style:{display:"flex",flexDirection:"column",gap:6}},
          ...byCat.map(({cat,collection,wantlist})=>
            h("div",{key:cat,style:{display:"flex",alignItems:"center",gap:10}},
              h("div",{style:{width:90,fontSize:"0.68rem",color:"var(--text3)",textAlign:"right",flexShrink:0}},cat),
              h(StackedBar,{collection,wantlist,max:maxCat})
            )
          )
        )
      )
    ),

    // By artist stacked bar
    h("div",{style:{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:12,padding:"20px 24px"}},
      h("div",{style:{fontSize:"0.62rem",color:"var(--text5)",textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:16}},"By artist — collection vs wantlist"),
      h("div",{style:{display:"flex",gap:12,marginBottom:14}},
        h("div",{style:{display:"flex",alignItems:"center",gap:6}},
          h("div",{style:{width:10,height:10,borderRadius:2,background:colColor}}),
          h("span",{style:{fontSize:"0.65rem",color:"var(--text4)"}},"Collection")),
        h("div",{style:{display:"flex",alignItems:"center",gap:6}},
          h("div",{style:{width:10,height:10,borderRadius:2,background:wlColor}}),
          h("span",{style:{fontSize:"0.65rem",color:"var(--text4)"}},"Wantlist"))
      ),
      h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
        ...byArtist.map(({artist,collection,wantlist})=>{
          const c=ac(artist);
          const total=collection+wantlist;
          const colPct=total>0?(collection/total*100).toFixed(0):0;
          return h("div",{key:artist,style:{display:"flex",alignItems:"center",gap:10}},
            h("div",{style:{width:120,fontSize:"0.72rem",color:c,textAlign:"right",flexShrink:0,fontWeight:600}},artist),
            h("div",{style:{flex:1,height:26,background:"var(--bg4)",borderRadius:6,overflow:"hidden",display:"flex"}},
              collection>0&&h("div",{style:{width:`${(collection/(maxArtist))*100}%`,background:colColor,display:"flex",alignItems:"center",justifyContent:"center",transition:"width 0.6s"}},
                h("span",{style:{fontSize:"0.65rem",color:"white",fontWeight:700}},collection)
              ),
              wantlist>0&&h("div",{style:{width:`${(wantlist/(maxArtist))*100}%`,background:wlColor,display:"flex",alignItems:"center",justifyContent:"center",transition:"width 0.6s"}},
                h("span",{style:{fontSize:"0.65rem",color:"white",fontWeight:700}},wantlist)
              )
            ),
            h("div",{style:{fontSize:"0.65rem",color:"var(--text5)",minWidth:40,textAlign:"right"}},`${colPct}% ✓`)
          );
        })
      )
    )
  );
}

// ── STATS ─────────────────────────────────────────────────
function groupBy(arr,key){return arr.reduce((a,i)=>{const k=i[key]||"—";a[k]=(a[k]||0)+1;return a;},{});}
function groupByVal(arr,key){return arr.reduce((a,i)=>{const k=i[key]||"—";a[k]=(a[k]||0)+(i.estimatedValue||0);return a;},{});}

function BarChart({data,colors,prefix="",maxItems=15}){
  const rows=Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,maxItems);
  const max=rows[0]?.[1]||1;
  return h("div",{style:{display:"flex",flexDirection:"column",gap:6}},
    ...rows.map(([lbl,val],i)=>h("div",{key:lbl,style:{display:"flex",alignItems:"center",gap:10}},
      h("div",{style:{width:110,fontSize:"0.68rem",color:"var(--text3)",textAlign:"right",flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},lbl),
      h("div",{style:{flex:1,height:22,background:"var(--bg4)",borderRadius:4,overflow:"hidden"}},
        h("div",{style:{height:"100%",borderRadius:4,width:`${(val/max)*100}%`,
          background:Array.isArray(colors)?colors[i%colors.length]:colors,
          display:"flex",alignItems:"center",paddingLeft:8,transition:"width 0.6s"}},
          h("span",{style:{fontSize:"0.62rem",color:"rgba(255,255,255,0.9)",fontWeight:600,whiteSpace:"nowrap"}},
            `${prefix}${val>999?val.toLocaleString():val}`)
        )
      )
    ))
  );
}

function DonutChart({data,colors}){
  const entries=Object.entries(data).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0);
  let cum=0;
  const segs=entries.map(([lbl,val],i)=>{const pct=val/total,start=cum;cum+=pct;return{lbl,val,pct,start,col:colors[i%colors.length]};});
  const sz=180,cx=90,cy=90,r=70,ir=45;
  const polar=(pct,rad)=>{const a=pct*2*Math.PI-Math.PI/2;return[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];};
  const segPath=(s,e)=>{const[x1,y1]=polar(s,r),[x2,y2]=polar(e,r),[ix1,iy1]=polar(e,ir),[ix2,iy2]=polar(s,ir),lg=(e-s)>0.5?1:0;return `M ${x1} ${y1} A ${r} ${r} 0 ${lg} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${ir} ${ir} 0 ${lg} 0 ${ix2} ${iy2} Z`;};
  return h("div",{style:{display:"flex",gap:24,alignItems:"center",flexWrap:"wrap"}},
    h("svg",{width:sz,height:sz,style:{flexShrink:0}},
      ...segs.map(s=>h("path",{key:s.lbl,d:segPath(s.start,s.start+s.pct),fill:s.col,stroke:"var(--bg)",strokeWidth:2,opacity:0.9})),
      h("text",{x:cx,y:cy-8,textAnchor:"middle",fill:"var(--text)",fontSize:22,fontWeight:700,fontFamily:"'Playfair Display',serif"},total),
      h("text",{x:cx,y:cy+12,textAnchor:"middle",fill:"var(--text4)",fontSize:9,fontFamily:"'DM Mono',monospace"},"TOTAL")
    ),
    h("div",{style:{display:"flex",flexDirection:"column",gap:6,flex:1}},
      ...segs.slice(0,12).map(s=>h("div",{key:s.lbl,style:{display:"flex",alignItems:"center",gap:8}},
        h("div",{style:{width:10,height:10,borderRadius:2,background:s.col,flexShrink:0}}),
        h("div",{style:{fontSize:"0.66rem",color:"var(--text3)",flex:1}},s.lbl),
        h("div",{style:{fontSize:"0.66rem",color:"var(--text)",fontWeight:600}},s.val),
        h("div",{style:{fontSize:"0.6rem",color:"var(--text5)"}},`${(s.pct*100).toFixed(1)}%`)
      ))
    )
  );
}

  const photos=cds.filter(c=>c.photos?.length).length;
  const topVal=Math.max(...cds.map(c=>c.estimatedValue||0));
  const topCd=cds.find(c=>c.estimatedValue===topVal);
  const byCountry=groupBy(cds,"country");
  const byArtist=groupBy(cds,"artist");
  const valByArtist=groupByVal(cds,"artist");
  const byCat=groupBy(cds,"genre");

        sub&&h("div",{style:{fontSize:"0.58rem",color:"var(--text5)",marginTop:1}},sub)

    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 2fr",gap:16}},

function ShareButton({cdId}){
  const [copied,setCopied]=useState(false);
  const share=()=>{
    const url=`${window.location.origin}${window.location.pathname}?cd=${cdId}`;
    navigator.clipboard.writeText(url).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };
  return h("button",{onClick:share,title:"Copy link",
    style:{position:"absolute",top:16,right:56,zIndex:10,
      background:copied?"rgba(74,222,128,0.2)":"rgba(0,0,0,0.4)",
      border:`1px solid ${copied?"rgba(74,222,128,0.5)":"rgba(255,255,255,0.15)"}`,
      color:copied?"#4ade80":"rgba(255,255,255,0.7)",
      height:32,borderRadius:8,cursor:"pointer",fontSize:"0.68rem",
      backdropFilter:"blur(8px)",display:"flex",alignItems:"center",
      justifyContent:"center",gap:6,padding:"0 10px",
      fontFamily:"'DM Mono',monospace",transition:"all 0.2s",whiteSpace:"nowrap"}},
    copied?h("span",null,"✓ Copied!"):h("span",null,"⎘ Share")
  );
}

function WantlistTree({items,onSelect}){
  const [openA,setOpenA]=useState({});
  const [openC,setOpenC]=useState({});
  const [openT,setOpenT]=useState({});
  const wArtists=["Queen","Freddie Mercury","Brian May","Roger Taylor","The Cross","Smile","Queen+"];
  const tree=useMemo(()=>{
    const out={};
    wArtists.forEach(artist=>{
      const aCds=items.filter(c=>c.artist===artist);
      if(!aCds.length) return;
      out[artist]={};
      const SINGLES_CATS=["CD3","CD5","CD5 Enhanced","CD3 · Live","CD5 · Live"];
      const rawCats=[...new Set(aCds.map(c=>c.genre.replace(" · Live","")))];
      const cats=[...new Set(rawCats.map(c=>SINGLES_CATS.includes(c)?"Singles":c))].sort();
      cats.forEach(cat=>{
        const cCds=cat==="Singles"
          ?aCds.filter(c=>SINGLES_CATS.includes(c.genre.replace(" · Live",""))||SINGLES_CATS.includes(c.genre))
          :aCds.filter(c=>c.genre.replace(" · Live","")=== cat&&!SINGLES_CATS.includes(c.genre.replace(" · Live","")));
        if(!cCds.length) return;
        out[artist][cat]={};
        const titles=[...new Set(cCds.map(c=>c.album))].sort((a,b)=>{
          const minA=Math.min(...cCds.filter(c=>c.album===a).map(c=>c.year||9999));
          const minB=Math.min(...cCds.filter(c=>c.album===b).map(c=>c.year||9999));
          return minA-minB;
        });
        titles.forEach(title=>{
          const COUNTRY_ORDER=["UK","EUROPE","NETHERLANDS","HOLLAND","JAPAN","USA"];
          const cRank=c=>{const i=COUNTRY_ORDER.indexOf((c.country||"").toUpperCase());return i>=0?i:COUNTRY_ORDER.length;};
          out[artist][cat][title]=cCds.filter(c=>c.album===title)
            .sort((a,b)=>{const d=(a.issueYear||0)-(b.issueYear||0);return d!==0?d:cRank(a)-cRank(b);});
        });
      });
    });
    return out;
  },[items]);
  const totVal=items.reduce((s,c)=>s+(c.estimatedValue||0),0);
  return h("div",{style:{display:"flex",flexDirection:"column",gap:4}},
    h("div",{style:{display:"flex",gap:20,padding:"6px 0 14px",borderBottom:"1px solid var(--border)",marginBottom:8,flexWrap:"wrap"}},

    ),
    items.length===0&&h("div",{style:{textAlign:"center",padding:60,color:"var(--text5)",fontFamily:"'DM Mono',monospace"}},
      h("div",{style:{fontSize:"2rem",marginBottom:12}},"★"),h("div",null,t.wantlistEmpty)
    ),
    ...Object.entries(tree).map(([artist,cats])=>{
      const c=ac(artist);
      const aCds=items.filter(x=>x.artist===artist);
      const aVal=aCds.reduce((s,x)=>s+(x.estimatedValue||0),0);
      const isOpen=openA[artist];
      return h("div",{key:artist,style:{marginBottom:4}},
        h("div",{className:"tree-row",onClick:()=>setOpenA(s=>({...s,[artist]:!s[artist]})),
          style:{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:10,cursor:"pointer",
            background:isOpen?`${c}18`:"var(--bg2)",border:`1px solid ${isOpen?c+"44":"var(--border)"}`,transition:"all 0.2s"}},
          h("div",{style:{width:36,height:36,borderRadius:8,flexShrink:0,background:`linear-gradient(135deg,${c}cc,${c}44)`,
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.85rem",fontWeight:900,color:"white",fontFamily:"'Playfair Display',serif"}},
            artist.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()),

            h("div",{style:{fontSize:"0.9rem",fontWeight:700,color:"var(--text)",fontFamily:"'Playfair Display',serif"}},artist),
            h("div",{style:{fontSize:"0.62rem",color:"var(--text4)",fontFamily:"'DM Mono',monospace",marginTop:2}},
              `${aCds.length} ${t.items}${isAdmin?" · €"+fmt(aVal):""}`)
          ),
          h("div",{style:{display:"flex",gap:8,alignItems:"center"}},

                          title+(discs[0]?.year>0?" ("+discs[0].year+")":"")),
                        h("div",{style:{fontSize:"0.6rem",color:"var(--text5)",marginTop:1}},
                          `${discs.length} ${discs.length===1?t.items.slice(0,-1):t.items}${isAdmin?" · €"+fmt(tVal):""}`)
                      ),
                      h("span",{style:{color:"var(--text5)",fontSize:"0.7rem",transition:"transform 0.2s",transform:isTOpen?"rotate(90deg)":"rotate(0)"}},"›")
                    ),
                    isTOpen&&h("div",{style:{marginLeft:16,marginTop:2,display:"flex",flexDirection:"column",gap:2}},
                      ...discs.map(cd=>{
                        return h("div",{key:cd.wantId,onClick:()=>onSelect(cd),
                          style:{display:"flex",alignItems:"center",gap:10,padding:"7px 12px",borderRadius:6,cursor:"pointer",
                            background:"var(--bg)",border:"1px solid var(--border)",transition:"background 0.15s"},
                          onMouseEnter:e=>e.currentTarget.style.background="var(--bg4)",
                          onMouseLeave:e=>e.currentTarget.style.background="var(--bg)"},
                          h("div",{style:{width:32,height:32,borderRadius:4,flexShrink:0,
                            background:`linear-gradient(135deg,${c}55,${c}11)`,
                            display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.85rem",color:c}},"★"),
                          h("div",{style:{flex:1,display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}},
                            h("div",{style:{fontSize:"0.62rem",color:"var(--text5)",fontFamily:"'DM Mono',monospace",minWidth:72}},cd.wantId),
                            h("div",{style:{fontSize:"0.72rem",color:"var(--text4)",display:"flex",alignItems:"center",gap:4}},
                              countryFlag(cd.country)&&h("span",{style:{fontSize:"0.85rem",lineHeight:1}},countryFlag(cd.country)),
                              cd.issueYear&&cd.issueYear!==cd.year?cd.issueYear:cd.year||""),
                            cd.country&&h("div",{style:{fontSize:"0.72rem",color:"var(--text4)",display:"flex",alignItems:"center",gap:4}},countryFlag(cd.country)&&h("span",{style:{fontSize:"0.85rem",lineHeight:1}},countryFlag(cd.country)),cd.country),
                            cd.label&&h("div",{style:{fontSize:"0.72rem",color:"var(--text4)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:130}},cd.label),
                            cd.categoryCase&&h("div",{style:{fontSize:"0.68rem",color:"var(--text5)"}},cd.categoryCase),
                            cd.type==="Promo"&&h("span",{style:{fontSize:"0.58rem",background:"#f59e0b22",border:"1px solid #f59e0b44",color:"#f59e0b",padding:"1px 6px",borderRadius:99,fontFamily:"'DM Mono',monospace",fontWeight:600}},"PROMO"),
                            cd.notes&&h("div",{style:{fontSize:"0.65rem",color:"var(--text5)",fontStyle:"italic",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:200}},cd.notes)
                          ),
                          isAdmin&&cd.estimatedValue>0&&h("div",{style:{fontSize:"0.75rem",color:"var(--gold)",fontFamily:"'DM Mono',monospace",fontWeight:600,minWidth:50,textAlign:"right"}},
                            `€${fmt(cd.estimatedValue)}`)
                        );
                      })
                    )
                  );
                })
              )
            );
          })
        )
      );
    })
  );
}


// ── ADMIN MODAL ───────────────────────────────────────────
function AdminModal({onSuccess,onClose}){
  const [pwd,setPwd]=useState("");
  const [err,setErr]=useState(false);
  const [checking,setChecking]=useState(false);
  const [pwdOk,setPwdOk]=useState(false);
  const [ghToken,setGhToken]=useState("");
  const savedToken=localStorage.getItem("gh_token");

  const checkPwd=async()=>{
    if(!pwd) return;
    setChecking(true);setErr(false);
    const ok=await checkPassword(pwd);
    setChecking(false);
    if(ok){setPwdOk(true);}
    else{setErr(true);setPwd("");}
  };

  const finish=()=>{
    const tokenToSave=ghToken||savedToken;
    if(tokenToSave) localStorage.setItem("gh_token",tokenToSave);
    onSuccess();
  };

  return h("div",{style:{position:"fixed",inset:0,zIndex:600,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.8)",backdropFilter:"blur(6px)"}},
    h("div",{onClick:e=>e.stopPropagation(),style:{background:"var(--bg2)",border:"1px solid var(--input-border)",borderRadius:14,padding:32,width:"100%",maxWidth:360,display:"flex",flexDirection:"column",gap:14}},
      h("div",{style:{textAlign:"center"}},
        h("div",{style:{fontSize:"2rem",marginBottom:8}},pwdOk?"🔓":"🔒"),
        h("h2",{style:{fontFamily:"'Playfair Display',serif",color:"var(--text)",fontSize:"1.2rem"}},
          pwdOk?"Add GitHub token":"Admin access")
      ),

      // Step 1: Password
      !pwdOk&&h("input",{type:"password",value:pwd,
        onChange:e=>{setPwd(e.target.value);setErr(false);},
        onKeyDown:e=>{if(e.key==="Enter")checkPwd();},
        placeholder:"Password",autoFocus:true,
        style:{background:"var(--input-bg)",border:`1px solid ${err?"#f87171":"var(--input-border)"}`,
          borderRadius:6,padding:"10px 14px",color:"var(--text)",
          fontFamily:"'DM Mono',monospace",fontSize:"0.85rem",outline:"none",width:"100%"}}),

      err&&h("div",{style:{fontSize:"0.72rem",color:"#f87171",textAlign:"center",
        fontFamily:"'DM Mono',monospace"}},"Incorrect password"),

      // Step 2: Token (only after password verified)
      pwdOk&&h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
        h("div",{style:{fontSize:"0.65rem",color:"var(--text4)",lineHeight:1.5}},
          savedToken
            ?"Token already saved. Leave blank to keep it, or paste a new one:"
            :"Paste your GitHub token for cross-device sync (optional):"
        ),
        h("input",{type:"password",value:ghToken,
          onChange:e=>setGhToken(e.target.value),
          onKeyDown:e=>{if(e.key==="Enter")finish();},
          placeholder:savedToken?"••••••••••••• (saved)":"ghp_...",
          autoFocus:true,
          style:{background:"var(--input-bg)",border:"1px solid var(--input-border)",
            borderRadius:6,padding:"10px 14px",color:"var(--text)",
            fontFamily:"'DM Mono',monospace",fontSize:"0.85rem",outline:"none",width:"100%"}})
      ),

      // Buttons
      h("div",{style:{display:"flex",gap:10,marginTop:4}},
        h("button",{onClick:onClose,
          style:{flex:1,background:"transparent",border:"1px solid var(--input-border)",
            color:"var(--text4)",borderRadius:6,padding:10,cursor:"pointer",
            fontFamily:"'DM Mono',monospace",fontSize:"0.78rem"}},"Cancel"),
        !pwdOk
          ?h("button",{onClick:checkPwd,disabled:checking||!pwd,
              style:{flex:2,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",
                color:"white",borderRadius:6,padding:10,cursor:"pointer",
                fontFamily:"'DM Mono',monospace",fontSize:"0.78rem",fontWeight:600,
                opacity:checking||!pwd?0.6:1}},
              checking?"Checking...":"Verify")
          :h("button",{onClick:finish,
              style:{flex:2,background:"linear-gradient(135deg,#4ade80,#22c55e)",border:"none",
                color:"white",borderRadius:6,padding:10,cursor:"pointer",
                fontFamily:"'DM Mono',monospace",fontSize:"0.78rem",fontWeight:600}},
              "Enter →")
      )
    )
  );
}

// ── APP ───────────────────────────────────────────────────
function App(){
  const [theme,setTheme]=useState("dark");
  const toggleTheme=()=>{const next=theme==="dark"?"light":"dark";setTheme(next);document.body.className=next;};
  const [lang,setLang]=useState("en");
  const [isAdmin,setIsAdmin]=useState(false);
  const [showAdminModal,setShowAdminModal]=useState(false);
  const handleLock=()=>{if(isAdmin){setIsAdmin(false);isAdmin=false;}else{setShowAdminModal(true);}};
  const [wantlistState,setWantlistState]=useState(ALL_WANTLIST);
  const moveToWantlist=useCallback((item)=>{
    setCds(prev=>prev.filter(c=>c.cdId!==item.cdId));
    setWantlistState(prev=>{
      const newId=`WL-${String(prev.length+1).padStart(4,"0")}`;
      const newItem={...item,wantId:newId,recentlyAdded:null,_fromCdId:item.cdId,_photoId:item._photoId||item.cdId};
      delete newItem.cdId;
      return [...prev,newItem];
    });
    setSelected(null);
    // Save to GitHub
    setSyncStatus("saving");
    ghGetState().then(state=>{
      if(!state) return setSyncStatus("error");
      const wl=[...(state.movedToWantlist||[])];
      const wlEntry={cdId:item.cdId,wantId:item.wantId,photoId:item._photoId||item.cdId};
      if(!wl.find(m=>m.cdId===item.cdId)) wl.push(wlEntry);
      // Remove from movedToCollection if it was there
      const moved=(state.movedToCollection||[]).filter(m=>(m.wantId||m)!==item.wantId);
      ghSaveState({movedToCollection:moved,movedToWantlist:wl},state._sha).then(sha=>{
        if(sha){ghShaRef.current=sha;setSyncStatus("idle");}
        else setSyncStatus("error");
      });
    });
  },[]);
  const moveToCollection=useCallback((item)=>{
    setWantlistState(prev=>prev.filter(c=>c.wantId!==item.wantId));
    setCds(prev=>{
      const newId=`CD-${String(prev.length+1).padStart(4,"0")}`;
      const newCd={...item,cdId:newId,photos:item.photos||[],recentlyAdded:Date.now(),_fromWantId:item.wantId,_photoId:item._photoId||item.wantId};
      delete newCd.wantId;
      return [...prev,newCd];
    });
    setSelected(null);
    // Save to GitHub
    setSyncStatus("saving");
    ghGetState().then(state=>{
      if(!state) return setSyncStatus("error");
      const moved=[...(state.movedToCollection||[])];
      // Store {wantId, cdId, photoId} so we can restore exactly
      const newEntry={wantId:item.wantId,cdId:item.cdId,photoId:item._photoId||item.wantId};
      if(!moved.find(m=>m.wantId===item.wantId)) moved.push(newEntry);
      // Remove from movedToWantlist if it was there
      const wl=(state.movedToWantlist||[]).filter(id=>(id.cdId||id)!==item.cdId);
      ghSaveState({movedToCollection:moved,movedToWantlist:wl},state._sha).then(sha=>{
        if(sha){ghShaRef.current=sha;setSyncStatus("idle");}
        else setSyncStatus("error");
      });
    });
  },[]);
  // On load check URL param
  // State ref for GitHub sha
  const ghShaRef = React.useRef(null);
  const [syncStatus,setSyncStatus]=useState("idle"); // idle | loading | saving | error

  useEffect(()=>{
    // Load URL param
    const p=new URLSearchParams(window.location.search);
    const id=p.get("cd");
    if(id){const cd=ALL_CDS.find(c=>c.cdId===id);if(cd)setSelected(cd);}

    // Load GitHub state
    setSyncStatus("loading");
    ghGetState().then(state=>{
      if(!state){setSyncStatus("error");return;}
      ghShaRef.current = state._sha;
      setSyncStatus("idle");

      // Apply movedToCollection
      if(state.movedToCollection?.length){
        state.movedToCollection.forEach(entry=>{
          const wantId=entry.wantId||entry;
          const restoredCdId=entry.cdId||null;
          const photoId=entry.photoId||wantId;
          const item = ALL_WANTLIST.find(c=>c.wantId===wantId);
          if(item){
            setCds(prev=>{
              if(prev.find(c=>c._fromWantId===wantId)) return prev;
              const newId=restoredCdId||`CD-${String(prev.length+1).padStart(4,"0")}`;
              const newCd={...item,cdId:newId,photos:item.photos||[],_fromWantId:wantId,_photoId:photoId};
              delete newCd.wantId;
              return [...prev,newCd];
            });
            setWantlistState(prev=>prev.filter(c=>c.wantId!==wantId));
          }
        });
      }

      // Apply movedToWantlist
      if(state.movedToWantlist?.length){
        state.movedToWantlist.forEach(entry=>{
          const cdId=entry.cdId||entry;
          const restoredWantId=entry.wantId||null;
          const photoId=entry.photoId||cdId;
          const item = ALL_CDS.find(c=>c.cdId===cdId);
          if(item){
            setWantlistState(prev=>{
              if(prev.find(c=>c._fromCdId===cdId)) return prev;
              const newId=restoredWantId||`WL-${String(prev.length+1).padStart(4,"0")}`;
              const newItem={...item,wantId:newId,_fromCdId:cdId,_photoId:photoId};
              delete newItem.cdId;
              return [...prev,newItem];
            });
            setCds(prev=>prev.filter(c=>c.cdId!==cdId));
          }
        });
      }
    });
  },[]);
  t = T[lang];
  const [cds,setCds]=useState(ALL_CDS);
  const [tab,setTab]=useState("collection");
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null);
  const [selected,setSelected]=useState(null);

  const filtered=useMemo(()=>{
    if(!search) return cds;
    const q=search.toLowerCase();
    return cds.filter(cd=>
      cd.artist.toLowerCase().includes(q)||
      cd.album.toLowerCase().includes(q)||
      (cd.label||"").toLowerCase().includes(q)||
      (cd.cdId||"").toLowerCase().includes(q)
    );
  },[cds,search]);

  const saveCd=form=>{
    setCds(prev=>form.cdId&&prev.find(c=>c.cdId===form.cdId)
      ?prev.map(c=>c.cdId===form.cdId?{...form,year:Number(form.year)||0,issueYear:Number(form.issueYear)||0,estimatedValue:Number(form.estimatedValue)||0}:c)
      :[...prev,{...form,cdId:`CD-${String(prev.length+1).padStart(4,"0")}`,year:Number(form.year)||0,issueYear:Number(form.issueYear)||0,estimatedValue:Number(form.estimatedValue)||0}]);
    setModal(null);
  };
  const delCd=cdId=>{if(confirm(lang==="en"?"Delete this CD?":"¿Eliminar este CD?"))setCds(prev=>prev.filter(c=>c.cdId!==cdId));};
  const handleEdit=cd=>{setSelected(null);setModal(cd);};

  const totVal=cds.reduce((s,c)=>s+(c.estimatedValue||0),0);
  const withPhotos=cds.filter(c=>c.photos?.length).length;
  const promos=cds.filter(c=>c.type==="Promo").length;
  const variants=cds.filter(c=>c.variety==="Variant").length;

  const inp={background:"var(--bg2)",border:"1px solid var(--border2)",borderRadius:6,
    padding:"7px 11px",color:"var(--text2)",fontFamily:"'DM Mono',monospace",fontSize:"0.74rem",outline:"none"};

  return h("div",{style:{minHeight:"100vh",background:"var(--bg)",color:"var(--text)"}},
    // Header
    h("div",{style:{borderBottom:"1px solid var(--border)",padding:"18px 24px 0",position:"sticky",
      top:0,zIndex:100,background:"var(--header-bg)",backdropFilter:"blur(16px)"}},
      h("div",{style:{maxWidth:1500,margin:"0 auto"}},
        h("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}},
          h("div",null,
            h("div",{style:{display:"flex",alignItems:"baseline",gap:12}},
              h("h1",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.7rem",fontWeight:900,
                background:"linear-gradient(135deg,#ffffff,#8080a0)",
                WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},t.title),
              h("span",{style:{fontSize:"0.65rem",color:"var(--text6)",letterSpacing:"0.15em"}},"CD LIBRARY")
            ),
            h("div",{style:{display:"flex",gap:18,marginTop:5,flexWrap:"wrap"}},
              ...[
                [cds.length,t.records,"var(--accent)"],
                [ARTISTS.length,t.artists,"var(--accent)"],
                [variants,t.variants,"#ec4899"],
                [promos,t.promos,"#f59e0b"],
                [`${withPhotos}/${cds.length}`,t.withPhotos,"#4ade80"],
                [`€${fmt(totVal)}`,t.totalValue,"#fbbf24"],
              ].map(([val,lbl,col])=>h("span",{key:lbl,style:{fontFamily:"'DM Mono',monospace",fontSize:"0.68rem",color:"var(--text5)"}},
                h("span",{style:{color:col}},lbl===t.totalValue&&!isAdmin?"—":val)," ",lbl))
            )
          ),
          h("div",{style:{display:"flex",gap:8,alignItems:"center",marginTop:4}},
            h("select",{value:lang,onChange:e=>{setLang(e.target.value);t=T[e.target.value];},
              style:{...inp,cursor:"pointer"}},
              h("option",{value:"en"},"🇬🇧 EN"),
              h("option",{value:"es"},"🇦🇷 ES")
            ),
            h("button",{onClick:toggleTheme,title:theme==="dark"?"Light mode":"Dark mode",
              style:{background:"transparent",border:"1px solid var(--border2)",borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:"1rem",transition:"all 0.2s",lineHeight:1,color:"var(--text3)"}},
              theme==="dark"?"☀️":"🌙"),
            syncStatus==="saving"&&h("div",{style:{fontSize:"0.62rem",color:"var(--text5)",fontFamily:"'DM Mono',monospace",display:"flex",alignItems:"center",gap:4}},
              h("div",{style:{width:6,height:6,borderRadius:"50%",background:"#f59e0b",animation:"pulse 1s infinite"}}),
              "saving..."),
            syncStatus==="error"&&h("div",{style:{fontSize:"0.62rem",color:"#f87171",fontFamily:"'DM Mono',monospace"}},"sync error"),
            syncStatus==="loading"&&h("div",{style:{fontSize:"0.62rem",color:"var(--text5)",fontFamily:"'DM Mono',monospace"}},"syncing..."),
            h("button",{onClick:handleLock,title:isAdmin?"Exit admin":"Admin",
              style:{background:isAdmin?"var(--bg2)":"var(--bg2)",border:`1px solid ${isAdmin?"#4ade8066":"var(--border2)"}`,borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:"1rem",transition:"all 0.2s",lineHeight:1}},
              isAdmin?"🔓":"🔒"),
            (tab==="collection")&&isAdmin&&h("button",{onClick:()=>setModal("add"),
              style:{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",color:"white",
                borderRadius:8,padding:"9px 16px",cursor:"pointer",fontFamily:"'DM Mono',monospace",
                fontSize:"0.75rem",fontWeight:600,letterSpacing:"0.05em",
                boxShadow:"0 4px 20px rgba(99,102,241,0.35)",whiteSpace:"nowrap"}},t.addCd)
          )
        ),
        // Tabs
        h("div",{style:{display:"flex",borderBottom:"1px solid var(--border)",marginBottom:-1}},
          ...["collection","wantlist","statistics"].map(t2=>
            h("button",{key:t2,className:`tab ${tab===t2?"active":""}`,onClick:()=>setTab(t2)},
              t2==="collection"?t.collection:t2==="wantlist"?t.wantlist:t.statistics)
          )
        )
      )
    ),

    // Search bar (collection + wantlist)
    (tab==="collection"||tab==="wantlist")&&h("div",{style:{borderBottom:"1px solid var(--border)",padding:"10px 24px",background:"var(--filter-bg)"}},
      h("div",{style:{maxWidth:1500,margin:"0 auto"}},
        h("input",{style:{...inp,width:"100%"},placeholder:t.search,value:search,onChange:e=>setSearch(e.target.value)})
      )
    ),

    // Content
    h("div",{style:{maxWidth:1500,margin:"0 auto",padding:"20px 24px"}},
      tab==="wantlist"
        ?h("div",{style:{maxWidth:1500,margin:"0 auto",padding:"20px 24px"}},
            h(WantlistTree,{items:search?wantlistState.filter(cd=>{const q=search.toLowerCase();return cd.artist.toLowerCase().includes(q)||cd.album.toLowerCase().includes(q)||(cd.label||"").toLowerCase().includes(q)||(cd.wantId||"").toLowerCase().includes(q);}):wantlistState,onSelect:setSelected})
          )
        :tab==="statistics"
        ?isAdmin?h(StatsTab,{cds}):h("div",{style:{textAlign:"center",padding:80,color:"var(--text5)",fontFamily:"'DM Mono',monospace"}},h("div",{style:{fontSize:"2rem",marginBottom:12}},"🔒"),h("div",null,"Admin access required"))
        :h(TreeView,{cds:filtered,onSelect:setSelected})
    ),

    selected&&h(CDPopup,{cd:selected,onMoveToWantlist:selected.cdId&&!selected.wantId?moveToWantlist:null,onClose:()=>{
        if(selected?.recentlyAdded){
          setCds(prev=>prev.map(c=>c.cdId===selected.cdId?{...c,recentlyAdded:null}:c));
        }
        setSelected(null);
      },onEdit:handleEdit,onMoveToCollection:selected.wantId?moveToCollection:null,adminMode:isAdmin,currentLang:lang}),
    showAdminModal&&h(AdminModal,{onSuccess:()=>{setIsAdmin(true);isAdmin=true;setShowAdminModal(false);},onClose:()=>setShowAdminModal(false)}),
    modal&&h(CDModal,{cd:modal==="add"?null:modal,onSave:saveCd,onClose:()=>setModal(null)})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
