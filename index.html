function App(){
  const [cds,setCds]=useState(ALL_CDS);
  const [view,setView]=useState("grid");
  const [search,setSearch]=useState("");
  const [filterArtist,setFilterArtist]=useState("");
  const [filterCategory,setFilterCategory]=useState("");
  const [filterCondition,setFilterCondition]=useState("");
  const [filterType,setFilterType]=useState("");
  const [sortBy,setSortBy]=useState("artist");
  const [modal,setModal]=useState(null);

  const filtered=useMemo(()=>cds.filter(cd=>{
    const q=search.toLowerCase();
    return(!q||cd.artist.toLowerCase().includes(q)||cd.album.toLowerCase().includes(q)||(cd.label||"").toLowerCase().includes(q)||(cd.cdId||"").toLowerCase().includes(q))
      &&(!filterArtist||cd.artist===filterArtist)&&(!filterCategory||cd.genre===filterCategory)
      &&(!filterCondition||cd.condition===filterCondition)&&(!filterType||cd.type===filterType);
  }).sort((a,b)=>{
    if(sortBy==="artist") return a.artist.localeCompare(b.artist)||a.album.localeCompare(b.album);
    if(sortBy==="album") return a.album.localeCompare(b.album);
    if(sortBy==="year") return (a.year||9999)-(b.year||9999);
    if(sortBy==="issue") return (a.issueYear||9999)-(b.issueYear||9999);
    if(sortBy==="value") return (b.estimatedValue||0)-(a.estimatedValue||0);
    if(sortBy==="id") return a.cdId.localeCompare(b.cdId);
    return 0;
  }),[cds,search,filterArtist,filterCategory,filterCondition,filterType,sortBy]);

  const saveCd=form=>{
    setCds(prev=>form.cdId&&prev.find(c=>c.cdId===form.cdId)
      ?prev.map(c=>c.cdId===form.cdId?{...form,year:Number(form.year)||0,issueYear:Number(form.issueYear)||0,estimatedValue:Number(form.estimatedValue)||0}:c)
      :[...prev,{...form,cdId:`CD-${String(prev.length+1).padStart(4,"0")}`,year:Number(form.year)||0,issueYear:Number(form.issueYear)||0,estimatedValue:Number(form.estimatedValue)||0}]);
    setModal(null);
  };
  const deleteCd=cdId=>{if(confirm("¿Eliminar este CD?"))setCds(prev=>prev.filter(c=>c.cdId!==cdId))};

  const totalValue=cds.reduce((s,c)=>s+(c.estimatedValue||0),0);
  const withPhotos=cds.filter(c=>c.photos&&c.photos.length>0).length;
  const promos=cds.filter(c=>c.type==="Promo").length;
  const variants=cds.filter(c=>c.variety==="Variant").length;

  return e("div",{style:{minHeight:"100vh",background:"#0a0a14",color:"#e8e8f0"}},
    e("div",{style:{borderBottom:"1px solid #1a1a28",padding:"18px 24px",position:"sticky",top:0,zIndex:100,background:"rgba(10,10,20,0.95)",backdropFilter:"blur(16px)"}},
      e("div",{style:{maxWidth:1500,margin:"0 auto"}},
        e("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}},
          e("div",null,
            e("div",{style:{display:"flex",alignItems:"baseline",gap:12}},
              e("h1",{style:{fontFamily:"'Playfair Display',serif",fontSize:"1.7rem",fontWeight:900,background:"linear-gradient(135deg,#ffffff,#8080a0)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"Mi Colección"),
              e("span",{style:{fontSize:"0.65rem",color:"#2a2a45",letterSpacing:"0.15em"}},"CD LIBRARY")
            ),
            e("div",{style:{display:"flex",gap:18,marginTop:5,flexWrap:"wrap"}},
              ...[["discos",cds.length,"#9090c8"],["artistas",ARTISTS.length,"#9090c8"],["variantes",variants,"#ec4899"],["promos",promos,"#f59e0b"],["con fotos",`${withPhotos}/${cds.length}`,"#4ade80"],["valor total",`€${totalValue.toLocaleString()}`,"#fbbf24"]].map(([label,val,color])=>
                e("span",{key:label,style:{fontSize:"0.68rem",color:"#3a3a5a"}},e("span",{style:{color}},val),` ${label}`)
              )
            )
          ),
          e("button",{onClick:()=>setModal("add"),style:{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",color:"white",borderRadius:8,padding:"9px 16px",cursor:"pointer",fontSize:"0.75rem",fontWeight:600,letterSpacing:"0.05em",boxShadow:"0 4px 20px rgba(99,102,241,0.35)",whiteSpace:"nowrap"}},`+ Agregar CD`)
        ),
        e("div",{style:{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}},
          e("input",{style:{...inputBase,flex:1,minWidth:180},placeholder:"Buscar artista, título, sello, ID...",value:search,onChange:ev=>setSearch(ev.target.value)}),
          e("select",{style:inputBase,value:filterArtist,onChange:ev=>setFilterArtist(ev.target.value)},e("option",{value:""},"Todos los artistas"),...ARTISTS.map(a=>e("option",{key:a,value:a},a))),
          e("select",{style:inputBase,value:filterCategory,onChange:ev=>setFilterCategory(ev.target.value)},e("option",{value:""},"Todas las categorías"),...CATEGORIES.map(g=>e("option",{key:g,value:g},g))),
          e("select",{style:inputBase,value:filterCondition,onChange:ev=>setFilterCondition(ev.target.value)},e("option",{value:""},"Todos los estados"),...CONDITIONS.map(c=>e("option",{key:c,value:c},c))),
          e("select",{style:inputBase,value:filterType,onChange:ev=>setFilterType(ev.target.value)},e("option",{value:""},"Commercial + Promo"),e("option",{value:"Commercial"},"Solo Commercial"),e("option",{value:"Promo"},"Solo Promo")),
          e("select",{style:inputBase,value:sortBy,onChange:ev=>setSortBy(ev.target.value)},
            e("option",{value:"artist"},"Artista A–Z"),e("option",{value:"album"},"Título A–Z"),
            e("option",{value:"id"},"ID (valor ↓)"),e("option",{value:"year"},"Año original"),
            e("option",{value:"issue"},"Año edición"),e("option",{value:"value"},"Valor ↓")
          ),
          e("div",{style:{display:"flex",border:"1px solid #1e1e30",borderRadius:6,overflow:"hidden"}},
            ...["grid","list"].map(v=>e("button",{key:v,onClick:()=>setView(v),style:{background:view===v?"#1e1e35":"transparent",border:"none",color:view===v?"#8080c0":"#3a3a5a",padding:"7px 11px",cursor:"pointer",fontSize:"0.9rem"}},v==="grid"?"⊞":"☰"))
          )
        )
      )
    ),
    e("div",{style:{maxWidth:1500,margin:"0 auto",padding:"20px 24px"}},
      filtered.length===0
        ?e("div",{style:{textAlign:"center",padding:80,color:"#2a2a40"}},e("div",{style:{fontSize:"3rem",marginBottom:12}},"◉"),"Sin resultados")
        :view==="grid"
          ?e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(158px,1fr))",gap:14}},
              ...filtered.map(cd=>e(CDCard,{key:cd.cdId,cd,onEdit:setModal,onDelete:deleteCd})))
          :e("div",{style:{background:"#10101c",border:"1px solid #1a1a28",borderRadius:10,overflow:"hidden"}},
              e("div",{style:{display:"grid",gridTemplateColumns:"44px 80px 1fr 130px 55px 85px 95px 75px 70px",gap:10,padding:"9px 16px",borderBottom:"1px solid #1a1a28"}},
                ...["","ID","Artista / Título","Sello","Año","Categoría","Estado","Valor",""].map((h,i)=>e("div",{key:i,style:{fontSize:"0.6rem",color:"#2a2a45",textTransform:"uppercase",letterSpacing:"0.12em"}},h))
              ),
              ...filtered.map(cd=>e(CDRow,{key:cd.cdId,cd,onEdit:setModal,onDelete:deleteCd}))
            ),
      e("div",{style:{textAlign:"center",marginTop:20,fontSize:"0.62rem",color:"#1e1e30"}},`${filtered.length} de ${cds.length} discos`)
    ),
    modal&&e(CDModal,{cd:modal==="add"?null:modal,onSave:saveCd,onClose:()=>setModal(null)})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
