name: Save Collection State

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'JSON state'
        required: true
      sha:
        description: 'Current file SHA'
        required: true

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Update state.json
        run: |
          echo '${{ github.event.inputs.state }}' | base64 -d > state_content.json
          curl -X PUT \
            -H "Authorization: token ${{ secrets.COLLECTION_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/contents/data/state.json \
            -d "{
              \"message\": \"Update collection state\",
              \"content\": \"$(base64 -w 0 state_content.json)\",
              \"sha\": \"${{ github.event.inputs.sha }}\"
            }"
